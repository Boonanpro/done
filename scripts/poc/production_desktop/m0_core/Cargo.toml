[package]
name = "m0_core"
version = "0.1.0"
edition = "2021"

# M0: from-scratch playback core proof (Filmora-parity gate #1).
# Pull-based frame server: Media Foundation Source Reader + D3D11 hardware decode
# (same DXVA/NVDEC silicon path Filmora uses). Measures random-seek latency and
# sequential decode throughput on REAL footage (proxy + 4K60 original).

[[bin]]
name = "m0_decode"
path = "src/m0_decode.rs"

[[bin]]
name = "m0_play"
path = "src/m0_play.rs"

[dependencies]
anyhow = "1"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_MediaFoundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_System_Threading",
  "Win32_Devices_Properties",
  "Win32_System_LibraryLoader",
]
