[package]
name = "native_ui"
version = "0.1.0"
edition = "2021"

# M1+M2: the fully-native editor — one process, zero seams.
# egui UI (GPU-drawn timeline) + M0 frame server (MF/D3D11 HW decode) +
# D3D11 shader compositor (layers + pop-out color×matte). Loads the REAL
# room contents.json (same document Dan reads/writes).

[[bin]]
name = "native_ui"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
lz4_flex = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
]
