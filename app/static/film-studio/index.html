<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dan · 映画を一緒に詰める</title><link rel="stylesheet" href="/studio/style.css">
<header><div><strong>Dan</strong><span>映画を一緒に詰める</span></div><div><span class="pill">2分 · 制作デモ</span><button id="sheetButton">条件を見る</button><a href="/api/package">制作内容を保存</a></div></header>
<main><section class="workspace"><div id="visuals"><div class="welcome"><span class="eyebrow">空飛ぶ車を開発する映画</span><h1>どんな物語にしよう。</h1><p>ヒアリングの条件は引き継いでいます。<br>展開の相談から始めて、人物・舞台・動きを一緒に詰められます。</p><p class="muted">「展開は決めていないから提案して」でも、<br>考えているアイデアを話しても大丈夫です。</p></div></div><nav id="scenes" aria-label="相談中の場面"></nav></section>
<aside><div class="voiceArea"><button id="voice" aria-label="音声会話を始める"><span class="orb"></span><span id="voiceLabel">ダンと話す</span></button><button id="mute" hidden>マイクをオフ</button><div id="status" role="status">話すか、下の入力欄から相談できます</div></div><div id="chat" aria-live="polite"></div><form id="form"><textarea id="text" rows="3" placeholder="もっとこうしたい、これが好き…" aria-label="ダンへの指示"></textarea><button id="send" type="submit">送信</button></form><p class="small">画像や3Dは必要に応じてダンが提示します。本番動画の生成は行いません。</p></aside></main>
<dialog id="sheet"><button id="closeSheet">閉じる</button><h2>引き継いだ条件</h2><dl id="sheetFields"></dl></dialog><audio id="audio" autoplay></audio><script src="/shared/editor-scene.js"></script><script src="/shared/editor-proposals.js"></script><script src="/studio/main.js"></script></html>
