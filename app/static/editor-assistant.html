<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>ダンと制作</title>
<style>
:root{color-scheme:dark;--bg:#101113;--fg:#f2f3f5;--muted:#a1a5af;--accent:#b8ceff;font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);height:100dvh;overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{border:0;cursor:pointer;background:transparent;border-radius:14px;min-height:44px;padding:8px 16px}button:hover{background:#ffffff0d}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
body>header{position:absolute;inset:24px 32px auto;display:flex;align-items:center;justify-content:space-between;z-index:3}.brand{font-size:15px;letter-spacing:.08em;font-weight:600;color:#d2d5dc}header nav{display:flex;gap:8px}#edit-view{color:var(--muted);font-size:13px}#close{color:var(--muted)}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7vw;padding:100px 7vw 140px;background:radial-gradient(ellipse at 50% 45%,#23283355,transparent 60%)}#presence{flex:0 0 280px;position:relative;display:flex;align-items:center;justify-content:center;height:320px;transition:transform .55s cubic-bezier(.2,.8,.2,1),flex-basis .55s}#orb{position:relative;width:208px;height:208px;border-radius:50%;isolation:isolate;transform:scale(calc(1 + var(--level,0)*.16));transition:transform .12s ease-out;box-shadow:0 0 75px #98b2ee12,inset 0 0 25px #ffffff10;background:radial-gradient(circle at 34% 24%,#ffffff90,transparent 38%),radial-gradient(circle at 65% 70%,#596c95,transparent 65%),#28303e;overflow:hidden;animation:breathe 5s ease-in-out infinite}#orb:before,#orb:after{content:'';position:absolute;border-radius:44%;width:160%;height:160%;left:-30%;top:-30%;background:conic-gradient(from 30deg,transparent,#dce9ff88,transparent 38%,#9db5e36b,transparent 75%);filter:blur(15px);animation:flow 17s linear infinite}#orb:after{animation-direction:reverse;animation-duration:23s;transform:rotate(85deg);opacity:.5}#orb .sheen{position:absolute;inset:0;border-radius:50%;z-index:2;background:radial-gradient(ellipse at 32% 20%,#fff9,transparent 30%);box-shadow:inset 0 0 2px 1px #ffffff55,inset -15px -25px 45px #070c1977}body[data-agent=thinking] #orb:before{animation-duration:4s}body[data-agent=speaking] #orb{box-shadow:0 0 90px #9dbaff33,inset 0 0 25px #ffffff20}body[data-agent=offline] #orb{filter:saturate(.35);opacity:.65}body[data-agent=error] #orb{box-shadow:0 0 70px #dfa79833}
#welcome{position:absolute;top:calc(50% + 135px);text-align:center;transition:opacity .3s;color:var(--muted);font-size:17px;white-space:nowrap}#welcome strong{display:block;color:var(--fg);font-size:28px;font-weight:500;letter-spacing:-.04em;margin-bottom:8px}body.connected #welcome{opacity:0;pointer-events:none}#references{display:none;min-width:0;max-width:760px;flex:1}body.has-references #references{display:block}body.has-references #presence{flex-basis:200px}body.has-references #orb{width:150px;height:150px}#reference-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.reference-card{overflow:hidden;border-radius:24px;background:#25272c;box-shadow:0 28px 75px #0005,inset 0 1px #ffffff12;animation:arrive .6s cubic-bezier(.16,1,.3,1) both}.reference-card video,.reference-card img,.reference-card iframe{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#16171a;border:0}.reference-copy{padding:18px 20px 20px}.reference-copy h2{font-size:17px;margin:0;font-weight:500}.reference-copy p{font-size:13px;color:#abb0bb;margin:6px 0 16px}.reference-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.reference-actions button{background:#e5ebf6;color:#171b23;font-size:13px;min-height:40px}.reference-actions a{color:#abb0bb;font-size:12px;text-decoration:none}#hide-references{float:right;font-size:12px;color:var(--muted);margin-top:8px}
#dock{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;border-radius:32px;background:#292c32a8;backdrop-filter:blur(24px);box-shadow:0 8px 32px #0003,inset 0 1px #ffffff10;z-index:4}#dock button{width:48px;height:48px;padding:0;border-radius:50%;color:#c4c9d3}#dock #mic{background:#edf1f9;color:#1c2331;width:56px;height:56px}#dock #mic.live{background:#d8e5ff}#disconnect{color:#e3abab!important}#state{position:absolute;bottom:116px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;max-width:80%;text-align:center;opacity:0;pointer-events:none}body:not(.connected) #state,body[data-agent=error] #state{opacity:1}
#drawer{position:absolute;right:24px;top:88px;bottom:112px;width:min(400px,calc(100vw - 48px));z-index:6;display:none;flex-direction:column;padding:24px;gap:16px;background:#24262ded;backdrop-filter:blur(32px);border-radius:24px;box-shadow:0 24px 80px #0006}body.drawer-open #drawer{display:flex;animation:arrive .3s ease-out}#drawer header{display:flex;align-items:center;justify-content:space-between}#drawer h2{font-size:17px;font-weight:500;margin:0}#log{flex:1;min-height:80px;overflow:auto;scrollbar-width:thin;font-size:14px}.message{padding:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{color:var(--accent)}.message.system{font-size:12px;color:var(--muted)}.message.error{color:#f5b3a8}textarea{width:100%;resize:none;border:1px solid #ffffff18;border-radius:14px;background:#12141966;padding:12px;min-height:72px}#send{background:#d8e5ff;color:#1c2331;align-self:flex-end}.tools-row{display:flex;gap:8px;flex-wrap:wrap}.tools-row button,select{font-size:12px;background:#ffffff08}select{max-width:100%;border:0;border-radius:8px;padding:8px}#target,#brief{font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:100px;overflow:auto}details{font-size:13px;color:var(--muted)}summary{cursor:pointer}#work-status{max-height:120px;overflow:auto;font-size:12px}.production-card{padding:8px 0}.activity-detail,.activity-steps{color:var(--muted);font-size:11px}.activity-steps{display:flex;gap:8px}.activity-steps .current{color:var(--accent)}#toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);max-width:80%;padding:12px 20px;background:#342927;border-radius:16px;color:#ffd5cc;z-index:9}#toast:empty{display:none}
body.compact>header{inset:16px}body.compact #stage{padding:70px 20px 116px;gap:8px;flex-direction:column}body.compact #presence{flex:0 0 180px;height:180px}body.compact #orb{width:120px;height:120px}body.compact #welcome{top:150px;font-size:13px}body.compact #welcome strong{font-size:21px}body.compact #references{width:100%;max-height:50vh;overflow:auto;flex:0 1 auto}body.compact #reference-cards{grid-template-columns:1fr}body.compact #dock{bottom:20px}body.compact #drawer{right:12px;top:64px;bottom:104px;width:calc(100vw - 24px);padding:16px}body.compact #state{bottom:104px}
@keyframes breathe{50%{translate:0 -5px}}@keyframes flow{to{rotate:360deg}}@keyframes arrive{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}@media(max-width:700px){#stage{flex-direction:column;gap:12px;padding:80px 24px 128px}#presence{flex-basis:240px}body.has-references #presence{flex-basis:120px}body.has-references #orb{width:96px;height:96px}#references{width:100%;overflow:auto}#reference-cards{grid-template-columns:1fr}body>header{inset:16px}#welcome strong{font-size:24px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}#orb{transform:none}}
body.compact>header{inset:16px 16px auto}body.has-references #welcome{display:none}@media(max-width:700px){body>header{inset:16px 16px auto}}
</style><link rel="stylesheet" href="/api/v1/editor-assistant/proposal-style"></head><body data-agent="offline">
<header><span class="brand">dan</span><nav><button id="edit-view" title="編集画面へ">編集画面へ ↗</button><button id="close" aria-label="閉じる">✕</button></nav></header>
<main id="stage"><div id="presence" role="img" aria-label="ダンは待機中"><div id="orb"><span class="sheen"></span></div><div id="welcome"><strong>思い描く、その先へ。</strong>どんな動画を作りたいですか。</div></div><section id="references" aria-label="ダンからの参考例"><div id="reference-cards"></div><button id="hide-references">参考例をしまう</button></section></main>
<div id="toast" role="alert"></div><div id="state" role="status">マイクを押して、話しかけてください</div>
<nav id="dock" aria-label="会話の操作"><button id="show-chat" aria-label="文字で伝える・会話履歴" title="文字で伝える・会話履歴"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H9l-5 4zM8 9h8M8 13h5"/></svg></button><button id="mic" aria-label="マイクで話す" title="マイクで話す"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3M9 21h6"/></svg></button><button id="disconnect" aria-label="会話を終了" title="会話を終了"><svg viewBox="0 0 24 24"><path d="M5 16v-4c0-5 14-5 14 0v4h-4v-4H9v4z"/></svg></button></nav>
<aside id="drawer" aria-label="会話と編集操作"><header><h2>ダンと制作</h2><button id="hide-chat" aria-label="会話履歴を閉じる">✕</button></header><div id="log" role="log" aria-live="polite"></div><div id="work-status"></div><textarea id="input" placeholder="言葉で伝える" aria-label="制作への指示" title="Space：再生停止 / Shift+Space：空白"></textarea><button id="send">送る</button><details><summary>作品と編集操作</summary><div id="target"></div><select id="scope" aria-label="制作の範囲"><option value="selected">選んだ部分</option><option value="whole">作品全体</option></select><div class="tools-row"><button id="pick">範囲を選ぶ</button><button id="clear">囲みを消す</button><button id="undo">変更を戻す</button><button id="approve">範囲を承認</button><button id="unlock">承認を解除</button><button id="new">新しい作品</button></div><div id="brief"></div></details></aside>
<script src="/api/v1/editor-assistant/proposal-script"></script><script src="/api/v1/editor-assistant/script"></script></body></html>
