<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dan — 動くコンテ</title><style>*{box-sizing:border-box}body{margin:0;background:#101211;color:#e8ece6;font:15px system-ui}main{max-width:1100px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:22px;font-weight:500;margin:0}small{color:#9ca69c}.stage{position:relative;border:1px solid #39403a;border-radius:16px;overflow:hidden;background:#edf0e8}canvas{width:100%;display:block;aspect-ratio:16/9}.badge{position:absolute;top:18px;left:20px;color:#66705e;font-size:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,input{font:inherit}button{border:1px solid #465045;border-radius:9px;padding:11px 17px;background:#20271f;color:inherit;cursor:pointer}button:hover{background:#313c2e}button[aria-pressed=true]{background:#c2e59b;color:#172014}form{display:flex;gap:10px;margin-top:16px}input{flex:1;min-width:0;background:#1b211b;border:1px solid #465045;border-radius:9px;padding:12px;color:white}#status{min-height:44px;padding-top:14px;color:#c2d4b7}.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px}label{display:grid;gap:8px;color:#b4bfb0}input[type=range]{width:100%;padding:0;accent-color:#bbdca0}footer{margin-top:28px;font-size:12px;color:#899683;line-height:1.8}@media(max-width:600px){.sliders{grid-template-columns:1fr}main{padding:20px 12px}}</style><main><header><h1>動くコンテ <small> / 一場面の操作デモ</small></h1><span id="fps"></span></header><div class="stage"><span class="badge">01 / 作業場を歩く人物</span><canvas id="scene" width="1280" height="720"></canvas></div><div class="controls"><button id="mic" aria-pressed="false">マイクで操作</button><button id="play">一時停止</button><button id="undo">戻す</button><button id="reset">最初に戻す</button></div><form id="command"><input id="words" aria-label="操作の指示" placeholder="人物を右に / カメラを寄せて / 歩く速度を落として"><button>実行</button></form><div id="status" role="status">人物の位置、カメラ、歩く速度を変えられます。</div><div class="sliders"><label>人物の位置<input id="position" type="range" min="-350" max="350" value="0"></label><label>カメラの距離<input id="zoom" type="range" min="0.65" max="2.4" step="0.01" value="1"></label><label>歩く速度<input id="speed" type="range" min="0" max="2.5" step="0.05" value="1"></label></div><footer>例：「もっと右」「少し引いて」「半分の速さに」「歩くのを止めて」。Spaceで再生・停止。<br>このデモの音声はブラウザの音声認識を利用します。LIVE1・Jevとの接続や長編コンテの作成は含みません。</footer></main><script>
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');
const initial={x:0,zoom:1,speed:1},state={...initial},visual={...initial},history=[];let playing=true,phase=0,last=performance.now();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function sync(){ $('position').value=state.x;$('zoom').value=state.zoom;$('speed').value=state.speed; }
function change(patch,text){history.push({...state});Object.assign(state,patch);state.x=clamp(state.x,-350,350);state.zoom=clamp(state.zoom,.65,2.4);state.speed=clamp(state.speed,0,2.5);sync();$('status').textContent=text;window.lastAppliedAt=performance.now();}
function command(raw){let s=raw.replace(/\s/g,'');let p={};const little=/少し|ちょっと/.test(s);if(/右/.test(s))p.x=state.x+(little?40:100);if(/左/.test(s))p.x=state.x-(little?40:100);if(/真ん中|中央/.test(s))p.x=0;if(/寄|ズームイン|近づ|アップ/.test(s))p.zoom=state.zoom+(little?.15:.35);if(/引い|引く|離|ズームアウト/.test(s))p.zoom=state.zoom-(little?.15:.35);if(/遅|落と|ゆっくり|半分/.test(s))p.speed=state.speed*.5;if(/速く|早く|上げ|倍/.test(s))p.speed=state.speed===0?1:state.speed*1.5;if(/止め|停止/.test(s))p.speed=0;if(/歩いて|歩かせ|歩き始/.test(s))p.speed=1;if(/元に戻|最初に/.test(s))p={...initial};if(!Object.keys(p).length){$('status').textContent='このデモでは人物の左右移動・カメラの寄り引き・歩く速度を操作できます。';return false;}change(p,raw+' → 反映しました');return true;}
window.conteDemo={state,command};$('command').onsubmit=e=>{e.preventDefault();command($('words').value);};
for(const [id,key]of [['position','x'],['zoom','zoom'],['speed','speed']]){let before;$ (id).onpointerdown=()=>{before={...state}};$(id).oninput=e=>{state[key]=Number(e.target.value);$('status').textContent='操作を反映しています';};$(id).onchange=()=>{if(before)history.push(before);before=null;};}
$('undo').onclick=()=>{if(history.length){Object.assign(state,history.pop());sync();$('status').textContent='一つ前に戻しました';}};$('reset').onclick=()=>change({...initial},'最初の状態に戻しました');function toggle(){playing=!playing;$('play').textContent=playing?'一時停止':'再生';}$('play').onclick=toggle;document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();toggle();}});
function line(points,width=5,color='#3d493d'){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();}
function draw(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)phase+=dt*state.speed*5;for(const k of ['x','zoom'])visual[k]+=(state[k]-visual[k])*(1-Math.exp(-dt*16));ctx.fillStyle='#edf0e8';ctx.fillRect(0,0,1280,720);ctx.save();ctx.translate(640,390);ctx.scale(visual.zoom,visual.zoom);ctx.translate(-640,-390);
for(let y=520;y<900;y+=45)line([[-600,y],[1900,y]],1,'#d5dacd');for(let x=-600;x<1900;x+=100)line([[640+(x-640)*.4,470],[x,900]],1,'#d5dacd');line([[-600,470],[1900,470]],2,'#bbc5b3');
line([[870,460],[870,290],[1100,290],[1100,460]],4,'#9ba68f');line([[850,330],[1120,330]],6,'#9ba68f');line([[925,288],[925,245],[1000,245],[1000,288]],3,'#9ba68f');line([[210,400],[210,205],[400,205],[400,400]],3,'#b3bdab');line([[305,205],[305,400]],2,'#b3bdab');
ctx.save();ctx.translate(570+visual.x,440);ctx.fillStyle='#ced5c5';ctx.beginPath();ctx.ellipse(0,37,60,9,0,0,Math.PI*2);ctx.fill();const a=Math.sin(phase)*.62,b=Math.sin(phase+Math.PI)*.62;const bob=Math.cos(phase*2)*3;ctx.translate(0,bob);line([[0,-122],[3,-57]],9);line([[-22,-108],[22,-108]],7);for(const [angle,col]of [[a,'#7e8b75'],[b,'#344130']]){line([[2,-57],[Math.sin(angle)*35,-15],[Math.sin(angle)*57,32],[Math.sin(angle)*57+17,32]],7,col);line([[0,-105],[-Math.sin(angle)*33,-73],[-Math.sin(angle)*44+12,-42]],6,col);}ctx.beginPath();ctx.arc(0,-147,23,0,Math.PI*2);ctx.fillStyle='#edf0e8';ctx.fill();ctx.strokeStyle='#344130';ctx.lineWidth=5;ctx.stroke();line([[9,-150],[18,-147]],2);ctx.restore();ctx.restore();requestAnimationFrame(draw);}requestAnimationFrame(draw);
let recognition=null;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('mic').onclick=()=>{if(recognition){recognition.stop();return;}if(!SR){$('status').textContent='このブラウザは音声認識に未対応です。Chromeで開くかテキストで操作してください。';return;}recognition=new SR();recognition.lang='ja-JP';recognition.continuous=true;recognition.interimResults=true;recognition.onstart=()=>{$('mic').setAttribute('aria-pressed','true');$('mic').textContent='マイクを止める';$('status').textContent='聞いています';};recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;$('words').value=t;if(e.results[i].isFinal)command(t);else $('status').textContent=t;}};recognition.onerror=e=>{$('status').textContent='音声認識: '+e.error+'。テキスト操作も使えます。';};recognition.onend=()=>{recognition=null;$('mic').setAttribute('aria-pressed','false');$('mic').textContent='マイクで操作';};recognition.start();};
</script></html>
