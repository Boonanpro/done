 let gesture=null,wheelTotal=0,lastWheel=0;
 carousel.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;gesture={x:e.clientX,y:e.clientY,id:e.pointerId};e.target.closest('.room-card')?.setPointerCapture(e.pointerId)});
 carousel.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3){suppressRoomClickUntil=performance.now()+400;moveRoom(dx<0?'next':'prev')}});
 carousel.addEventListener('pointercancel',()=>{gesture=null});
 carousel.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;e.preventDefault();if(performance.now()-lastWheel<350)return;wheelTotal+=e.deltaX;if(Math.abs(wheelTotal)>35){moveRoom(wheelTotal>0?'next':'prev');wheelTotal=0;lastWheel=performance.now()}},{passive:false});
 carousel.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();moveRoom(e.key==='ArrowRight'?'next':'prev')}});
 updateRoomControls();
}
}
let suppressRoomClickUntil=0;
function roomContents(r){return `<span class="room-meta"><span>${icon('clock')}${t('creating')}</span>${icon(r.icon)}</span><strong>${escapeHtml(r.title)}</strong><span class="room-task">${r[lang]}</span><span class="room-open">${icon('arrow')}</span>`}
function updateRoomControls(){document.querySelectorAll('.room-dots button').forEach((b,i)=>b.setAttribute('aria-current',String(i===roomIndex)));const prev=document.querySelector('[data-page=prev]'),next=document.querySelector('[data-page=next]');if(prev)prev.disabled=roomIndex===0;if(next)next.disabled=roomIndex===activeRooms.length-1;}
function moveRoom(direction){const n=direction==='next'?Math.min(activeRooms.length-1,roomIndex+1):direction==='prev'?Math.max(0,roomIndex-1):Number(direction);const card=document.querySelector('.room-card');if(!card||n===roomIndex||!activeRooms[n])return;roomIndex=n;const r=activeRooms[n];card.dataset.room=String(n);card.setAttribute('aria-label',r.title+' — '+r[lang]);card.innerHTML=roomContents(r);document.querySelector('.room-announcement').textContent=`${n+1} / ${activeRooms.length} · ${escapeHtml(r.title)} · ${r[lang]}`;updateRoomControls();}
document.addEventListener('click',e=>{if(performance.now()<suppressRoomClickUntil&&e.target.closest('.room-carousel')){e.preventDefault();e.stopImmediatePropagation()}},true);
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let toastTimer;function toast(text){document.querySelector('.demo-toast')?.remove();clearTimeout(toastTimer);const n=document.createElement('div');n.className='demo-toast';n.setAttribute('role','status');n.textContent=text;document.getElementById('phone').append(n);toastTimer=setTimeout(()=>n.remove(),3500)}
document.addEventListener('click',e=>{const shared=e.target.closest('[data-shared]');if(shared)selectedCollab=Number(shared.dataset.shared);const pager=e.target.closest('[data-page]');if(pager){moveRoom(pager.dataset.page);return}const room=e.target.closest('[data-room]');if(room)selectedRoom=Number(room.dataset.room);const c=e.target.closest('[data-concept]');if(c){concept=c.dataset.concept;screen='home';sheet=null;render();return}const f=e.target.closest('[data-screen]');if(f){screen=f.dataset.screen;sheet=null;render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='dismiss'&&e.target.closest('.sheet')&&!e.target.closest('button'))return;if(['home','work','collab','collab-chat','chat','detail','preview','settings','new','call','profile','collab-new'].includes(a)){screen=a;sheet=null;query=''}else if(a==='save-profile'){profileName=profileDraft.trim();screen='collab'}else if(a==='create-collab'){if(!roomDraft.trim())return;sharedRooms.unshift({title:roomDraft.trim(),message:'',time:'',unread:0});roomDraft='';selectedCollab=0;scenario='normal';document.getElementById('scenario').value='normal';screen='collab-chat'}else if(a==='search'){screen='work';query=''}else if(a==='attach'||a==='voice-options'||a==='stop'){sheet=a}else if(a==='dismiss'){sheet=null}else if(a==='lang-en'||a==='lang-ja'){lang=a.slice(5)}else if(a==='clear'){query=''}else if(a==='mute'){muted=!muted}else if(a==='retry'){scenario='normal';document.getElementById('scenario').value='normal'}else if(a==='send'){toast(t('notSent'));return}else if(a==='sample'||a==='team'){sheet=null;render();toast(t('sample'));return}render();if(sheet)document.querySelector('.sheet button')?.focus();if(a==='search')document.getElementById('project-search')?.focus()});
document.addEventListener('input',e=>{if(e.target.id==='collab-field'){if(screen==='profile')profileDraft=e.target.value;else roomDraft=e.target.value;document.querySelector('[data-action="'+(screen==='profile'?'save-profile':'create-collab')+'"]').disabled=!e.target.value.trim();}if(e.target.id==='project-search'){query=e.target.value;document.getElementById('project-results').innerHTML=results()}if(e.target.id==='draft'){draft=e.target.value;document.querySelector('[data-action=send]').disabled=!draft.trim()}});
document.addEventListener('keydown',e=>{if(sheet&&e.key==='Escape'){sheet=null;render()}if(sheet&&e.key==='Tab'){const nodes=[...document.querySelectorAll('.sheet button')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.getElementById('language').onchange=e=>{lang=e.target.value;render()};document.getElementById('scenario').onchange=e=>{scenario=e.target.value;if(!['home','work','collab'].includes(screen))screen='home';sheet=null;render()};render();
</script></body></html>
