# Codex opened in the running Dan's folder or a worktree of it: refuse writes to what git tracks in the running folder,
# with a plain explanation; the code itself carries macOS's immutable flag (scripts/live_lock.py, 2026-10-24).
# Codex runs a project hook only after the project is trusted once.
[[hooks.PreToolUse]]
matcher = "Bash|apply_patch"
hooks = [{ type = "command", command = "python \"$(git rev-parse --show-toplevel)/scripts/hook_live_tree_guard.py\"", timeout = 30 }]

